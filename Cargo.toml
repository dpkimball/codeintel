[package]
name = "codeintel"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
authors = ["Binder contributors"]
license = "MIT"
description = "Code intelligence domain — Git-synced semantic graph stored in bindb"
repository = "https://github.com/dpkimball/codeintel"
homepage = "https://github.com/dpkimball/codeintel-releases"
readme = "README.md"
# Library stays private; public consumers use codeintel-releases binaries.
publish = false

[package.metadata.dist]
dist = true

[[bin]]
name = "codeintel"
path = "src/main.rs"

[dependencies]
bindb = { path = "../bindb" }
syn = { version = "2", features = ["full", "visit", "extra-traits"] }
proc-macro2 = { version = "1", features = ["span-locations"] }
quote = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
toml = "0.8"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
