name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch: {}

concurrency:
  group: codeintel-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout codeintel
        uses: actions/checkout@v4
        with:
          path: codeintel

      # Path dependency is ../bindb. The default GITHUB_TOKEN cannot read
      # another private repository. PAT_WORKFLOWGITACTION can. GitHub does not
      # pass that secret to a pull request from a fork; after bindb is public,
      # github.token is enough.
      - name: Checkout bindb
        uses: actions/checkout@v4
        with:
          repository: dpkimball/bindb
          ref: master
          path: bindb
          persist-credentials: false
          token: ${{ secrets.PAT_WORKFLOWGITACTION || github.token }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            codeintel/target
          key: ${{ runner.os }}-codeintel-${{ hashFiles('codeintel/Cargo.lock') }}

      - name: Format check
        working-directory: codeintel
        run: cargo fmt -- --check

      - name: Clippy
        working-directory: codeintel
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Test
        working-directory: codeintel
        run: cargo test --locked
