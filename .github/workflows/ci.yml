name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch: {}

concurrency:
  group: codeintel-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout codeintel
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          path: codeintel

      # Path dependency is ../bindb. bindb is public, so the default token can
      # read it, including on a fork pull request. The ref is a commit.
      - name: Checkout bindb
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: dpkimball/bindb
          ref: 40730ea18571f2e1ba8cc9e9c7be635a33351a37
          path: bindb
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            codeintel/target
          key: ${{ runner.os }}-codeintel-${{ hashFiles('codeintel/Cargo.lock') }}

      - name: Format check
        working-directory: codeintel
        run: cargo fmt -- --check

      - name: Clippy
        working-directory: codeintel
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Test
        working-directory: codeintel
        run: cargo test --locked
