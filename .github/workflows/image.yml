name: Image

# Maintainer image build. Not on pull_request: a fork must not reach the
# self-hosted runner. The job is in this repository so a public checkout does
# not call the private dpk-ci reusable workflow. Path dependency is bindb.
on:
  push:
    branches: [master]
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

concurrency:
  group: codeintel-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker:
    runs-on: product-ci
    timeout-minutes: 60
    steps:
      - name: Reset self-hosted workspace
        shell: bash
        run: find "${GITHUB_WORKSPACE}" -mindepth 1 -maxdepth 1 -exec rm -rf {} +

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          path: codeintel

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: dpkimball/bindb
          path: bindb

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ./codeintel
          file: ./codeintel/Dockerfile
          build-contexts: bindb=./bindb
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/codeintel:latest
            ghcr.io/${{ github.repository_owner }}/codeintel:${{ github.sha }}
          provenance: false
          sbom: false
          cache-from: type=gha,scope=codeintel-image
          cache-to: type=gha,mode=max,scope=codeintel-image,ignore-error=true
