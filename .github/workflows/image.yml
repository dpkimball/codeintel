name: Image

# Private image build. Not on pull_request: untrusted PR code must not
# reach product-ci or inherited secrets. Public checks are in ci.yml.
on:
  push:
    branches: [master]
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

concurrency:
  group: codeintel-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker:
    uses: dpkimball/dpk-ci/.github/workflows/build-rust-binary-image.yml@master
    with:
      project_name: codeintel
      path_dep_repo: bindb
      runner: product-ci
    secrets: inherit
