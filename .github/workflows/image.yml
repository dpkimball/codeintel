name: Image

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

concurrency:
  group: codeintel-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker:
    uses: dpkimball/dpk-ci/.github/workflows/build-rust-binary-image.yml@master
    with:
      project_name: codeintel
      path_dep_repo: bindb
      runner: product-ci
    secrets: inherit
