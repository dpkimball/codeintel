# Consumer workflow: thin call into dpk-ci security-audit-dispatch.
name: Security Audit

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - "**/*.md"
      - "**/*.mdx"
      - "**/*.rst"
      - "**/*.txt"
  push:
    branches: [master, main]
  workflow_dispatch:

concurrency:
  group: security-audit-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  security-audit:
    uses: dpkimball/dpk-ci/.github/workflows/security-audit-dispatch.yml@master
    with:
      repository_name: codeintel
      github_repository: dpkimball/codeintel
      classification: high
      runner: product-ci
    secrets: inherit
